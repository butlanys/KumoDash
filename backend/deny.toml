# KumoDash 依赖策略配置
# 使用 cargo-deny 检查依赖安全性、许可证合规性和来源
# 运行: cargo deny check

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

# 禁止特定依赖
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# 禁止已知有安全问题的 crate
deny = [
    # 已弃用或有安全问题的 crate
    { crate = "openssl", wrappers = ["native-tls"] },  # 优先使用 rustls
]

# 跳过重复版本检查的 crate
skip = []

# 跳过特定版本树的检查
skip-tree = []

# 许可证检查 (新版格式)
[licenses]
confidence-threshold = 0.8
private = { ignore = true }

# 允许的许可证
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
]

# 私有 crate (本项目)
[[licenses.clarify]]
crate = "kumadash"
expression = "MIT"
license-files = []

# 许可证例外
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# 安全公告检查
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

# 依赖来源检查
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
# 允许来自特定 GitHub 组织的 git 依赖
github = []
