_version: 2

# 错误消息
errors:
  auth:
    invalid_credentials: "认证失败: %{reason}"
    credentials_wrong: "用户名或密码错误"
    current_password_wrong: "当前密码错误"
    token_expired: "Token 已过期"
    token_invalid: "Token 无效"
    account_locked: "账户已锁定"
    permission_denied: "权限不足"
  
  validation:
    generic: "验证失败: %{reason}"
    password_too_short: "密码长度至少为8位"
    password_weak: "密码必须包含大小写字母和数字"
    username_length: "用户名长度必须在3-50个字符之间"
    username_format: "用户名只能包含字母、数字、下划线和连字符"
  
  setup:
    invalid_token: "安装链接无效或已过期"
    already_completed: "系统已初始化"
  
  resource:
    not_found: "资源未找到: %{resource}"
    user_not_found: "用户不存在"
    admin_not_found: "管理员不存在"
    page_not_found: "页面不存在"
  
  rate_limit:
    exceeded: "请求过于频繁，请稍后再试"
  
  database:
    error: "数据库错误: %{detail}"
  
  internal:
    error: "内部服务器错误"

# 成功消息
success:
  setup:
    completed: "系统初始化成功"
  auth:
    login: "登录成功"
    logout: "已成功注销"
  password:
    changed: "密码修改成功"
