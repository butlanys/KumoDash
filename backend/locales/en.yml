_version: 2

# Error messages
errors:
  auth:
    invalid_credentials: "Authentication failed: %{reason}"
    credentials_wrong: "Invalid username or password"
    current_password_wrong: "Current password is incorrect"
    token_expired: "Token has expired"
    token_invalid: "Invalid token"
    account_locked: "Account is locked"
    permission_denied: "Permission denied"
  
  validation:
    generic: "Validation failed: %{reason}"
    password_too_short: "Password must be at least 8 characters"
    password_weak: "Password must contain uppercase, lowercase letters and numbers"
    username_length: "Username must be between 3 and 50 characters"
    username_format: "Username can only contain letters, numbers, underscores and hyphens"
  
  setup:
    invalid_token: "Setup link is invalid or has expired"
    already_completed: "System has already been initialized"
  
  resource:
    not_found: "Resource not found: %{resource}"
    user_not_found: "User not found"
    admin_not_found: "Administrator not found"
    page_not_found: "Page not found"
  
  rate_limit:
    exceeded: "Too many requests, please try again later"
  
  database:
    error: "Database error: %{detail}"
  
  internal:
    error: "Internal server error"

# Success messages
success:
  setup:
    completed: "System initialized successfully"
  auth:
    login: "Login successful"
    logout: "Logged out successfully"
  password:
    changed: "Password changed successfully"
